<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Timelapse Capture</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar__brand">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-dot"></span>
          </div>
          <h1 class="brand-title">
            <span class="brand-title__primary">Timelapse</span>
            <span class="brand-title__secondary">Capture</span>
          </h1>
        </div>

        <nav class="mode-toggle" role="tablist" aria-label="Mode">
          <button class="mode-toggle__btn is-active" data-mode="capture" role="tab" aria-selected="true">
            Capture
          </button>
          <button class="mode-toggle__btn" data-mode="playback" role="tab" aria-selected="false">
            Playback
          </button>
          <span class="mode-toggle__indicator" aria-hidden="true"></span>
        </nav>

        <button class="icon-btn settings-btn" id="settings-open" aria-label="Open settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <main id="view-root" class="view-root">
        <!-- Views are mounted here -->
      </main>

      <aside id="settings-drawer" class="drawer" aria-hidden="true">
        <div class="drawer__backdrop" data-close></div>
        <div class="drawer__panel" role="dialog" aria-label="Settings" aria-modal="true">
          <header class="drawer__head">
            <h2>Settings</h2>
            <button class="icon-btn" id="settings-close" aria-label="Close settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
          </header>
          <div class="drawer__body" id="settings-body"></div>
        </div>
      </aside>

      <div id="modal-root" class="modal-root" aria-hidden="true"></div>
      <div id="toast-root" class="toast-root" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
